name: CI

on:
  # Also run on PUSH to an integration branch (not just PRs into it), so the branch
  # tip itself is always a verified state before it merges to main.
  push:
    branches: [main, "integration/**"]
  # Convention: multi-PR work stacks on a long-lived `integration/<name>` branch and
  # merges to main once. Gating PRs into integration/** means every stacked PR is
  # CI-verified the whole way in, not only when the series finally lands on main.
  pull_request:
    branches: [main, "integration/**"]

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The test suite, defined once and run on every OS witness ships a native binary for. Same
  # command everywhere: `go test` directly, because the Windows runner promises no make and the
  # Makefile's -p 1 / GOMAXPROCS limits exist for a laptop, not a CI box. Windows earned its place
  # here: every Windows defect before it ran in CI was found by hand, and #220's six fixes made it
  # green. fail-fast is off so one OS failing still reports the other.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test fails in minutes instead of holding a required check for GitHub's 6-hour default.
    # Measured over 25 runs: the Windows runner starts within seconds and the suite takes ~3 min.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
      WITNESS_DISABLE_EXTERNAL_RUNNERS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

  # Everything that is not the test suite and only needs to run once: formatting, vet, the race
  # detector, the release artefacts' own checks, and the cross-compile.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Formatting is a hard gate — the whole tree must be gofmt-clean.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # Reuse the Makefile so the CGO_ENABLED=0 + cross-compile invariant lives in exactly one
      # place. No model or `claude` CLI needed: tests inject fake embedders, and the only go:embed
      # files (the OpenCode plugin JS, the view's page.js/page.css) are committed.
      - name: vet
        run: make vet

      # -race needs cgo on Linux, so this one step turns it on; the shipped binary stays
      # CGO_ENABLED=0 (build-all below). Targeted at the two packages with concurrent passes,
      # whose tests ask for -race and can't fail without it: TestProgressLineIsSafeForConcurrentUse
      # passes with its mutex removed unless the race detector is watching.
      - name: test (race detector)
        env:
          CGO_ENABLED: "1"
          WITNESS_DISABLE_EXTERNAL_RUNNERS: "1"
        run: go test -race ./cmd/commands ./internal/distill

      # The rest of what a release ships. These ran only on the release event before, so a
      # stale JS assertion passed PR CI and then blocked the v0.7.0 publish (release gotcha
      # #1), and a manifest that drifted from the version surfaced only after the tag existed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: opencode plugin tests
        run: npm --prefix npm/opencode run check

      - name: release manifests (versions + MCP Registry description cap)
        run: ./scripts/check-release-manifests.sh

      # Prove the "one pure-Go binary" promise on every target we ship.
      - name: cross-compile (darwin/linux × amd64/arm64)
        run: make build-all
