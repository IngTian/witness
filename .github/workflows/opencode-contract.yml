name: OpenCode contract

# Real OpenCode v2 against witness on Linux and Windows: the contract tests
# (internal/platform/opencode/contract_*_test.go, //go:build opencodecontract) that make test never
# compiles.
#   - pinned + channels run on a PR that touches what they test (or a `pinned` dispatch): the pinned
#     release binaries from pins.txt, then each install channel (npm, curl, desktop).
#   - latest runs daily against the newest npm release, and report files an issue when it fails.
# Never a required check: it downloads real OpenCode from opencode.ai and npm, and their outage must
# not block a merge. contractpins_test.go (make test) keeps the pins, the matrix and OPENCODE_NEWEST
# on the range version.go claims.
on:
  pull_request:
    branches: [main, "integration/**"]
    paths:
      - "internal/platform/opencode/**"
      - "npm/opencode/**"
      - "internal/proc/**"
      # What only T7 (and the capture test's `wire`) exercises: the worker's containment and
      # Detach, `worker stop`, the wakeup spawn, the mine/review engine and the OpenCode wiring.
      - "cmd/commands/worker.go"
      - "cmd/commands/cli.go"
      - "cmd/commands/distill.go"
      - "cmd/commands/worker_wakeup.go"
      - "cmd/commands/install.go"
      - "cmd/commands/install_windows.go"
      - "internal/distill/**"
      - "scripts/opencode-contract/**"
      - ".github/workflows/opencode-contract.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "pinned: the pinned versions and install channels; latest: the newest npm release"
        type: choice
        options: [pinned, latest]
        default: pinned

permissions:
  contents: read

# A PR's newer push cancels its older run. The event and mode are in the group, so a manual dispatch
# never cancels the daily run, nor a `pinned` dispatch a `latest` one (mode is empty off dispatch).
concurrency:
  group: opencode-contract-${{ github.event_name }}-${{ inputs.mode }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  OPENCODE_NEWEST: "2.3.0" # what the channel legs install; contractpins_test.go keeps it = the newest pin

defaults:
  run:
    shell: bash

# The timeouts: a job's 35 min outlasts its go tests' 5 + 25 min plus setup, so a hung test fails
# with go test's own goroutine dump, not a bare job cancel.
jobs:
  pinned:
    if: github.event_name == 'pull_request' || inputs.mode == 'pinned'
    name: pinned (${{ matrix.os }}, ${{ matrix.opencode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        opencode: ["2.2.7", "2.3.0"]
    env:
      WITNESS_CONTRACT_CHANNEL: pinned
      WITNESS_CONTRACT_OPENCODE_VERSION: ${{ matrix.opencode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Into the checkout's bin/ under make build's name: on Unix, `wire opencode` targets
      # <dir of this binary>/../hooks/witness.sh, the in-repo shim (Task 3.6). WITNESS_ASSETS goes
      # to $GITHUB_ENV, so every later step has it: the go tests pass it to each witness they run,
      # and T7 fails without the model.
      - name: build witness
        run: |
          bin=bin/witness-$(go env GOOS)-$(go env GOARCH)$(go env GOEXE)
          go build -o "$bin" ./cmd/witness
          if [ "$RUNNER_OS" = Windows ]; then dir=$(pwd -W); else dir=$PWD; fi
          echo "WITNESS_CONTRACT_WITNESS_BIN=$dir/$bin" >> "$GITHUB_ENV"
          echo "WITNESS_ASSETS=$RUNNER_TEMP/assets" >> "$GITHUB_ENV"

      # restore + save, not actions/cache: its post-job save is skipped on a red job, so a leg that
      # fails would download the ~470 MB model again next time. The save runs right after the fetch,
      # before any test can fail. Keyed on fetch.go, which pins the model's revision and hashes.
      - uses: actions/cache/restore@v4
        id: model-cache
        with:
          path: ${{ runner.temp }}/assets
          key: e5-${{ hashFiles('internal/model/fetch.go') }}

      - name: embedding model
        timeout-minutes: 5
        run: '"$WITNESS_CONTRACT_WITNESS_BIN" model fetch'

      - uses: actions/cache/save@v4
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/assets
          key: e5-${{ hashFiles('internal/model/fetch.go') }}

      # fetch.sh never runs the binary, so T11 below is its first run.
      - name: fetch OpenCode ${{ matrix.opencode }}
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = Windows ]; then asset=opencode-windows-x64.zip; else asset=opencode-linux-x64-baseline.tar.gz; fi
          scripts/opencode-contract/fetch.sh "$WITNESS_CONTRACT_OPENCODE_VERSION" "$asset" "$RUNNER_TEMP/opencode"
          echo "$RUNNER_TEMP/opencode" >> "$GITHUB_PATH"

      # installSystemProvider (T7) writes the mock provider as /etc/opencode/opencode.json, the one
      # config a worker's private serve still loads. On Windows it moves ProgramData in-process.
      - name: make /etc/opencode writable
        if: runner.os == 'Linux'
        run: sudo install -d -o "$(id -u)" /etc/opencode

      # T11 times the binary's FIRST run, so it runs alone, before anything else executes it:
      # requireContract probes the binary in every test that sorts before contract_windows_test.go.
      - name: first-run latency (T11)
        if: runner.os == 'Windows'
        run: go test -tags opencodecontract -count=1 -timeout 5m -run '^TestContractWindowsFirstRunLatency$' -v ./internal/platform/opencode/

      - name: contract tests
        run: go test -tags opencodecontract -count=1 -timeout 25m -run '^TestContract' -skip '^TestContractWindowsFirstRunLatency$' -v ./internal/platform/opencode/

  channels:
    if: github.event_name == 'pull_request' || inputs.mode == 'pinned'
    name: channels (${{ matrix.os }}, ${{ matrix.channel }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, channel: npm, run: "^TestContract" }
          - { os: windows-latest, channel: npm, run: "^TestContract" }
          - { os: windows-latest, channel: curl, run: "^TestContractWindowsResolve$" }
          - { os: windows-latest, channel: desktop, run: "^TestContractWindowsResolve$" }
    env:
      WITNESS_CONTRACT_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No shared module/build cache: the curl leg pipes the unpinned opencode.ai installer into bash.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # As in pinned, on the npm legs only: T5, all the curl and desktop legs run, needs neither
      # witness nor the model.
      - name: build witness
        if: matrix.channel == 'npm'
        run: |
          bin=bin/witness-$(go env GOOS)-$(go env GOARCH)$(go env GOEXE)
          go build -o "$bin" ./cmd/witness
          if [ "$RUNNER_OS" = Windows ]; then dir=$(pwd -W); else dir=$PWD; fi
          echo "WITNESS_CONTRACT_WITNESS_BIN=$dir/$bin" >> "$GITHUB_ENV"
          echo "WITNESS_ASSETS=$RUNNER_TEMP/assets" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        if: matrix.channel == 'npm'
        id: model-cache
        with:
          path: ${{ runner.temp }}/assets
          key: e5-${{ hashFiles('internal/model/fetch.go') }}

      - name: embedding model
        if: matrix.channel == 'npm'
        timeout-minutes: 5
        run: '"$WITNESS_CONTRACT_WITNESS_BIN" model fetch'

      - uses: actions/cache/save@v4
        if: matrix.channel == 'npm' && steps.model-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/assets
          key: e5-${{ hashFiles('internal/model/fetch.go') }}

      - uses: actions/setup-node@v4
        if: matrix.channel == 'npm'
        with:
          node-version: "22"

      # T3 and T5 expect npm's shim and exe under the prefix npm really used, which on a runner is
      # not %APPDATA%\npm. The package's postinstall runs `opencode --version`, so on this leg T11
      # measures a second run.
      - name: install with npm
        if: matrix.channel == 'npm'
        run: |
          npm i -g "@opencode/cli@$OPENCODE_NEWEST"
          prefix=$(npm prefix -g)
          if [ "$RUNNER_OS" = Windows ]; then prefix=$(cygpath -w "$prefix"); fi
          echo "WITNESS_CONTRACT_NPM_PREFIX=$prefix" >> "$GITHUB_ENV"

      # The installer appends ~/.opencode/bin to $GITHUB_PATH whenever GITHUB_ACTIONS=true, even with
      # --no-modify-path (install:470-473), so it runs with that variable empty: T5-curl proves
      # ResolveExe finds the install by its canonical path only while opencode is off PATH.
      - name: install with the curl installer
        if: matrix.channel == 'curl'
        run: curl -fsSL https://opencode.ai/v2/install | GITHUB_ACTIONS='' bash -s -- --version "$OPENCODE_NEWEST" --no-modify-path

      - name: opencode stays off PATH
        if: matrix.channel == 'curl'
        run: |
          if p=$(command -v opencode); then echo "::error::opencode is on PATH at $p, so T5-curl would prove nothing"; exit 1; fi

      - name: fetch the desktop installer
        if: matrix.channel == 'desktop'
        timeout-minutes: 5
        run: scripts/opencode-contract/fetch.sh "$OPENCODE_NEWEST" opencode-desktop-win-x64.exe "$RUNNER_TEMP/desktop"

      # T5-desktop checks the install left the user PATH alone, against this file. pwsh 7 writes
      # UTF-8; Windows PowerShell 5.1's default UTF-16 the test cannot read.
      - name: install the desktop app (silent)
        if: matrix.channel == 'desktop'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $before = Join-Path $env:RUNNER_TEMP 'user-path-before.txt'
          [Environment]::GetEnvironmentVariable('Path', 'User') | Out-File -FilePath $before -Encoding utf8NoBOM
          "WITNESS_CONTRACT_PATH_BEFORE=$before" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          $p = Start-Process -Wait -PassThru -FilePath (Join-Path $env:RUNNER_TEMP 'desktop\opencode-desktop-win-x64.exe') -ArgumentList '/S'
          if ($p.ExitCode -ne 0) { throw "desktop installer exited $($p.ExitCode)" }
          Stop-Process -Name OpenCode, opencode-cli -ErrorAction SilentlyContinue

      - name: make /etc/opencode writable
        if: runner.os == 'Linux'
        run: sudo install -d -o "$(id -u)" /etc/opencode

      - name: first-run latency (T11)
        if: runner.os == 'Windows' && matrix.channel == 'npm'
        run: go test -tags opencodecontract -count=1 -timeout 5m -run '^TestContractWindowsFirstRunLatency$' -v ./internal/platform/opencode/
        env:
          WITNESS_CONTRACT_OPENCODE_VERSION: ${{ env.OPENCODE_NEWEST }}

      - name: contract tests
        run: go test -tags opencodecontract -count=1 -timeout 25m -run "$RUN" -skip '^TestContractWindowsFirstRunLatency$' -v ./internal/platform/opencode/
        env:
          RUN: ${{ matrix.run }}
          WITNESS_CONTRACT_OPENCODE_VERSION: ${{ env.OPENCODE_NEWEST }}

  latest:
    if: github.event_name == 'schedule' || inputs.mode == 'latest'
    name: latest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    outputs:
      version: ${{ steps.fetch.outputs.version }}
    env:
      WITNESS_CONTRACT_CHANNEL: latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No shared module/build cache: this job runs the newest, unpinned OpenCode.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # As in pinned.
      - name: build witness
        run: |
          bin=bin/witness-$(go env GOOS)-$(go env GOARCH)$(go env GOEXE)
          go build -o "$bin" ./cmd/witness
          if [ "$RUNNER_OS" = Windows ]; then dir=$(pwd -W); else dir=$PWD; fi
          echo "WITNESS_CONTRACT_WITNESS_BIN=$dir/$bin" >> "$GITHUB_ENV"
          echo "WITNESS_ASSETS=$RUNNER_TEMP/assets" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        id: model-cache
        with:
          path: ${{ runner.temp }}/assets
          key: e5-${{ hashFiles('internal/model/fetch.go') }}

      - name: embedding model
        timeout-minutes: 5
        run: '"$WITNESS_CONTRACT_WITNESS_BIN" model fetch'

      - uses: actions/cache/save@v4
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/assets
          key: e5-${{ hashFiles('internal/model/fetch.go') }}

      # The newest @opencode/cli on npm, unpinned (its sha is logged). requireContract then checks
      # the binary on PATH is that version.
      - name: fetch the latest OpenCode
        id: fetch
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = Windows ]; then asset=opencode-windows-x64.zip; else asset=opencode-linux-x64-baseline.tar.gz; fi
          v=$(scripts/opencode-contract/fetch.sh latest "$asset" "$RUNNER_TEMP/opencode")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "WITNESS_CONTRACT_OPENCODE_VERSION=$v" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/opencode" >> "$GITHUB_PATH"

      - name: make /etc/opencode writable
        if: runner.os == 'Linux'
        run: sudo install -d -o "$(id -u)" /etc/opencode

      - name: first-run latency (T11)
        if: runner.os == 'Windows'
        run: go test -tags opencodecontract -count=1 -timeout 5m -run '^TestContractWindowsFirstRunLatency$' -v ./internal/platform/opencode/

      - name: contract tests
        run: go test -tags opencodecontract -count=1 -timeout 25m -run '^TestContract' -skip '^TestContractWindowsFirstRunLatency$' -v ./internal/platform/opencode/

  # One open issue per breakage: the first failing day opens it, later ones comment on it.
  report:
    needs: latest
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.latest.outputs.version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: open or update the issue
        run: |
          body="The daily contract run against OpenCode ${VERSION:-latest (its version was never resolved)} failed: $RUN_URL"
          gh label create opencode-contract --force --description "The daily OpenCode contract run is failing"
          n=$(gh issue list --label opencode-contract --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "OpenCode contract: the daily run against latest is failing" --label opencode-contract --body "$body"
          fi
